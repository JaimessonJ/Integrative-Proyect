<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CineMax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(174, 88, 88); padding-top: 50px;">

    <section class="registro-section container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                
                <div class="formulario-cine">
                    <h2>Crear Cuenta</h2>
                    <p class="subtitulo">Únete al club y recibe preventas exclusivas.</p>
                    
                    <form action="#">
                        <div class="grupo-input" style="margin-bottom: 15px;">
                            <label for="nombre" style="display:block; margin-bottom:5px;">Nombre Completo</label>
                            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                        </div>

                        <div class="grupo-input" style="margin-bottom: 15px;">
                            <label for="correo" style="display:block; margin-bottom:5px;">Correo Electrónico</label>
                            <input type="email" id="correo" placeholder="nombre@correo.com" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                        </div>

                        <div class="grupo-input" style="margin-bottom: 15px;">
                            <label for="password" style="display:block; margin-bottom:5px;">Contraseña</label>
                            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                        </div>

                        <div class="grupo-terminos" style="margin-bottom: 20px;">
                            <input type="checkbox" id="terminos" required>
                            <label for="terminos">Acepto los términos y condiciones.</label>
                        </div>

                        <button type="submit" class="btn-cine" style="width: 100%; padding: 10px; font-weight: bold; border-radius: 5px; border: none;">Registrarme</button>
                    </form>
                </div>

            </div>
        </div>
    </section>
        
</body>
</html>
